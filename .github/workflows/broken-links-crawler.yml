name: Broken Links Crawler
on: 
  workflow_dispatch:
  push:
    branches: 
      - master
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '35 13 5,19 * *'
jobs:
  crawl_for_broken_links:
    runs-on: ubuntu-latest
    name: Broken-Links-Crawler
    steps:
    - name: Debug Action
      uses: hmarr/debug-action@v1.0.0
    - name: Checking broken links
      id: check-broken-links
      uses: ScholliYT/Broken-Links-Crawler-Action@v3.3.1
      with:
        website_url: "https://keymapdb.com"
        exclude_url_prefix: "/assets,https://mechdb.net"
        # reddit.com and github.com/user-attachments block scripted clients
        # outright (403), regardless of retries or user agent, so they're
        # permanent false positives for this crawler.
        exclude_url_contained: "reddit.com,github.com/user-attachments"
        # Avoid tripping GitHub's rate limiting (429) by not hammering the
        # same host with many parallel requests.
        connect_limit_per_host: 2
        max_retries: 4
        max_retry_time: 60
        # The crawler stops going deeper once it leaves the keymapdb domain
        # so it won't accidentally crawl the whole web even if you put -1.
        max_depth: -1
        verbose: true
